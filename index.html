<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch Predictions Overlay</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Rajdhani', 'sans-serif'],
          },
          colors: {
            twitch: {
              purple: '#9146FF',
              darkPurple: '#5c16c5',
              dark: '#0e0e10',
              card: '#18181b',
              border: '#26262c',
              accent: '#00f5d4'
            }
          },
          animation: {
            'glow-winner': 'glowWinner 1.5s ease-in-out infinite alternate',
          },
          keyframes: {
            glowWinner: {
              '0%': { boxShadow: '0 0 15px rgba(16, 185, 129, 0.3)' },
              '100%': { boxShadow: '0 0 35px rgba(16, 185, 129, 0.8), 0 0 15px rgba(0, 245, 212, 0.5)' }
            }
          }
        }
      }
    }
  </script>

  <style>
    body.overlay-only {
      background: transparent !important;
    }

    body.overlay-only #toast {
      display: none !important;
    }
    
    .glass-panel {
      background: rgba(18, 18, 23, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .glass-card {
      background: rgba(30, 30, 38, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .widget-animated {
      transition: opacity 0.5s ease-out, transform 0.5s ease-out;
    }
    .widget-hidden {
      opacity: 0 !important;
      transform: translateY(-20px) scale(0.96);
      pointer-events: none;
    }
    .widget-visible {
      opacity: 1 !important;
      transform: translateY(0) scale(1);
    }

    .overlay-box-fixed {
      width: 100%;
      max-width: 768px;
      overflow: hidden !important;
    }

    /* Container de Rolagem Automática JS (Garante compatibilidade total no OBS) */
    .auto-scroll-container {
      overflow: hidden;
      white-space: nowrap;
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }
    .auto-scroll-track {
      display: flex;
      gap: 0.4rem;
      align-items: center;
      will-change: transform;
    }
    .auto-scroll-container:hover .auto-scroll-track {
      animation-play-state: paused;
    }
  </style>
</head>
<body class="bg-[#09090b] text-gray-100 font-sans min-h-screen selection:bg-twitch-purple selection:text-white">

  <!-- CABEÇALHO ADMIN -->
  <header id="app-header" class="bg-twitch-dark border-b border-twitch-border p-3 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="bg-twitch-purple p-2 rounded-xl text-white shadow-lg shadow-twitch-purple/30">
        <i data-lucide="help-circle" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="font-display text-xl font-extrabold tracking-wider text-white uppercase flex items-center gap-2">
          Overlay de Palpites <span class="bg-twitch-purple/20 text-twitch-purple text-xs px-2 py-0.5 rounded-full border border-twitch-purple/40 font-sans">v0.8 JS Marquee</span>
        </h1>
        <p class="text-xs text-gray-400">Rolagem automática contínua via JS com simetria e auto-hide em 10s</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <div id="connection-status" class="flex items-center gap-1.5 bg-[#0e0e10] border border-twitch-border px-3 py-1.5 rounded-xl text-xs font-semibold text-gray-400">
        <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse" id="status-dot"></span>
        <span id="status-text">Conectando à Twitch...</span>
      </div>

      <button onclick="toggleViewMode()" id="view-mode-btn" class="flex items-center gap-2 bg-twitch-card hover:bg-gray-800 text-sm font-semibold py-2 px-4 rounded-xl border border-twitch-border transition-all">
        <i data-lucide="layout-dashboard" class="w-4 h-4 text-twitch-purple"></i>
        <span id="view-mode-text">Apenas Overlay (OBS)</span>
      </button>

      <button onclick="copyOverlayUrl()" class="flex items-center gap-2 bg-twitch-purple hover:bg-twitch-darkPurple text-white text-sm font-semibold py-2 px-4 rounded-xl transition-all shadow-md shadow-twitch-purple/20">
        <i data-lucide="copy" class="w-4 h-4"></i>
        <span>Copiar URL p/ OBS</span>
      </button>
    </div>
  </header>

  <!-- CONTAINER PRINCIPAL -->
  <main id="main-container" class="p-4 md:p-6 max-w-7xl mx-auto">
    <div id="dual-view" class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- CONTROLES LOCAIS -->
      <section class="lg:col-span-5 space-y-6">
        <div class="bg-twitch-card rounded-2xl border border-twitch-border p-5 shadow-xl">
          <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
            <i data-lucide="settings" class="w-5 h-5 text-twitch-purple"></i>
            Configurar Palpite Manual
          </h2>

          <form id="prediction-form" onsubmit="handleStartPrediction(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Pergunta do Palpite</label>
              <input type="text" id="input-title" required placeholder="Ex: Vamos escapar?" class="w-full bg-[#0e0e10] border border-twitch-border focus:border-twitch-purple rounded-xl p-3 text-sm text-white focus:outline-none">
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Duração</label>
              <div class="grid grid-cols-3 gap-2">
                <button type="button" onclick="setTimerInput(60)" class="bg-[#0e0e10] hover:bg-twitch-purple/20 border border-twitch-border text-xs py-2 rounded-lg font-semibold">1 Minuto</button>
                <button type="button" onclick="setTimerInput(120)" class="bg-[#0e0e10] hover:bg-twitch-purple/20 border border-twitch-border text-xs py-2 rounded-lg font-semibold">2 Minutos</button>
                <button type="button" onclick="setTimerInput(300)" class="bg-[#0e0e10] hover:bg-twitch-purple/20 border border-twitch-border text-xs py-2 rounded-lg font-semibold">5 Minutos</button>
              </div>
              <div class="mt-2 flex items-center gap-2">
                <input type="number" id="input-timer" min="10" max="3600" value="120" required class="w-full bg-[#0e0e10] border border-twitch-border focus:border-twitch-purple rounded-xl p-2.5 text-sm text-white focus:outline-none">
                <span class="text-xs text-gray-400 font-medium">segundos</span>
              </div>
            </div>

            <div>
              <div class="flex justify-between items-center mb-2">
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Preset de Opções</label>
                <div class="flex gap-1">
                  <button type="button" onclick="presetOptions(2)" class="text-[10px] bg-[#0e0e10] border border-twitch-border px-2 py-0.5 rounded text-gray-300 hover:text-white">2 Opções</button>
                  <button type="button" onclick="presetOptions(4)" class="text-[10px] bg-[#0e0e10] border border-twitch-border px-2 py-0.5 rounded text-gray-300 hover:text-white">4 Opções</button>
                  <button type="button" onclick="presetOptions(6)" class="text-[10px] bg-[#0e0e10] border border-twitch-border px-2 py-0.5 rounded text-gray-300 hover:text-white">6 Opções</button>
                  <button type="button" onclick="presetOptions(10)" class="text-[10px] bg-[#0e0e10] border border-twitch-border px-2 py-0.5 rounded text-gray-300 hover:text-white">10 Opções</button>
                </div>
              </div>
              <div id="options-input-container" class="space-y-2"></div>
            </div>

            <button type="submit" id="btn-start" class="w-full bg-gradient-to-r from-twitch-purple to-purple-600 hover:from-purple-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
              <i data-lucide="play" class="w-5 h-5 fill-current"></i>
              Iniciar Palpite Local
            </button>
          </form>
        </div>

        <div class="bg-twitch-card rounded-2xl border border-twitch-border p-5 shadow-xl space-y-4">
          <h2 class="text-lg font-bold text-white flex items-center gap-2">
            <i data-lucide="sliders" class="w-5 h-5 text-twitch-purple"></i>
            Controle de Simulação (Cenários)
          </h2>

          <div class="grid grid-cols-2 gap-2">
            <button onclick="lockPrediction()" id="btn-lock" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 py-2.5 px-3 rounded-xl font-semibold text-xs flex items-center justify-center gap-1.5 transition-all">
              <i data-lucide="lock" class="w-4 h-4"></i> Trancar Votos
            </button>
            <button onclick="cancelPrediction()" id="btn-cancel" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 py-2.5 px-3 rounded-xl font-semibold text-xs flex items-center justify-center gap-1.5 transition-all">
              <i data-lucide="x-circle" class="w-4 h-4"></i> Resetar / Cancelar
            </button>
          </div>

          <hr class="border-twitch-border my-2">
          <div>
            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Simular Votos Locais</label>
            <div id="vote-simulation-controls" class="space-y-2"></div>
          </div>

          <hr class="border-twitch-border my-2">
          <div class="space-y-2">
            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">Testes Rápidos de Cenários</label>
            <button onclick="simulate10OptionsScenario()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-2 px-3 rounded-xl flex items-center justify-center gap-1.5 transition-all">
              <i data-lucide="layers" class="w-4 h-4"></i> Testar 10 Opções Ativas
            </button>
            <button onclick="simulateHeavyResult()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 px-3 rounded-xl flex items-center justify-center gap-1.5 transition-all">
              <i data-lucide="sparkles" class="w-4 h-4"></i> Simular Resultado Completo (Top 10+)
            </button>
            <div id="resolve-controls" class="grid grid-cols-1 gap-2 pt-1"></div>
          </div>
        </div>
      </section>

      <!-- VISUALIZAÇÃO PREVIEW NO ADMIN -->
      <section class="lg:col-span-7 flex flex-col">
        <div class="bg-twitch-card/60 rounded-2xl border border-twitch-border p-4 flex-1 flex flex-col">
          <div class="flex items-center justify-between mb-4">
            <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
              Visualização Prévia do Overlay (OBS)
            </span>
            <span class="text-xs text-amber-400 font-semibold">Auto-Hide & Reset em 10s ao encerrar</span>
          </div>

          <div class="flex-1 min-h-[500px] bg-[#050508] border border-dashed border-twitch-border rounded-xl p-4 md:p-8 flex items-center justify-center relative overflow-hidden">
            <div id="overlay-widget-container" class="w-full overlay-box-fixed widget-animated widget-hidden"></div>
          </div>
        </div>
      </section>

    </div>

    <!-- MODO OVERLAY EXCLUSIVO OBS (STANDALONE) -->
    <div id="overlay-only-view" class="hidden min-h-screen flex items-center justify-center p-4">
      <div id="overlay-standalone-container" class="w-full overlay-box-fixed widget-animated widget-hidden"></div>
    </div>
  </main>

  <div id="toast" class="fixed bottom-5 right-5 bg-twitch-purple text-white px-4 py-3 rounded-xl shadow-2xl transition-all transform translate-y-20 opacity-0 flex items-center gap-2 text-sm font-semibold z-50">
    <i data-lucide="check-circle" class="w-5 h-5"></i>
    <span id="toast-message">Mensagem</span>
  </div>

  <script>
    const VERCEL_API_URL = window.location.origin.includes('localhost') 
      ? '/api/subscribe' 
      : 'https://twitch-prediction-overlay-steel.vercel.app/api/subscribe';

    const OPTION_COLORS = [
      { name: 'Azul Twitch', hex: '#3894FE', bg: 'bg-[#3894FE]', text: 'text-[#3894FE]', border: 'border-[#3894FE]' },
      { name: 'Rosa/Magenta', hex: '#F14A97', bg: 'bg-[#F14A97]', text: 'text-[#F14A97]', border: 'border-[#F14A97]' },
      { name: 'Ciano', hex: '#00F5D4', bg: 'bg-[#00F5D4]', text: 'text-[#00F5D4]', border: 'border-[#00F5D4]' },
      { name: 'Amarelo', hex: '#FEE440', bg: 'bg-[#FEE440]', text: 'text-[#FEE440]', border: 'border-[#FEE440]' },
      { name: 'Roxo', hex: '#9146FF', bg: 'bg-[#9146FF]', text: 'text-[#9146FF]', border: 'border-[#9146FF]' },
      { name: 'Laranja', hex: '#FF9F1C', bg: 'bg-[#FF9F1C]', text: 'text-[#FF9F1C]', border: 'border-[#FF9F1C]' },
      { name: 'Verde', hex: '#10B981', bg: 'bg-[#10B981]', text: 'text-[#10B981]', border: 'border-[#10B981]' },
      { name: 'Vermelho', hex: '#EF4444', bg: 'bg-[#EF4444]', text: 'text-[#EF4444]', border: 'border-[#EF4444]' },
      { name: 'Violeta', hex: '#8B5CF6', bg: 'bg-[#8B5CF6]', text: 'text-[#8B5CF6]', border: 'border-[#8B5CF6]' },
      { name: 'Índigo', hex: '#6366F1', bg: 'bg-[#6366F1]', text: 'text-[#6366F1]', border: 'border-[#6366F1]' }
    ];

    let predictionState = {
      title: "",
      status: "IDLE",
      totalDuration: 0,
      remainingTime: 0,
      winningOptionId: null,
      isVisible: false,
      options: []
    };

    let timerInterval = null;
    let autoHideTimeout = null;
    let twitchSocket = null;
    const broadcastChannel = new BroadcastChannel('twitch_prediction_channel');

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('overlay') === 'true') {
        enableOverlayOnlyMode();
      }

      renderOptionInputs(['Sim', 'Não']);
      renderApp();

      broadcastChannel.onmessage = (event) => {
        if (event.data) {
          predictionState = event.data;
          renderApp();
        }
      };

      connectTwitchEventSub();
      lucide.createIcons();
    };

    function resetStateMachine(newStatus = 'IDLE') {
      clearInterval(timerInterval);
      clearTimeout(autoHideTimeout);
      timerInterval = null;
      autoHideTimeout = null;

      predictionState.status = newStatus;
      predictionState.winningOptionId = null;
      predictionState.isVisible = (newStatus !== 'IDLE');
    }

    function scheduleAutoHide(delayMs = 10000) {
      clearTimeout(autoHideTimeout);
      autoHideTimeout = setTimeout(() => {
        updateState({ isVisible: false, status: 'IDLE', winningOptionId: null });
      }, delayMs);
    }

    function connectTwitchEventSub() {
      updateConnectionStatus('connecting', 'Conectando à Twitch...');
      twitchSocket = new WebSocket('wss://eventsub.wss.twitch.tv/ws');

      twitchSocket.onopen = () => {
        console.log('✅ Conectado ao WebSocket EventSub da Twitch!');
      };

      twitchSocket.onmessage = async (event) => {
        const response = JSON.parse(event.data);
        const messageType = response.metadata.message_type;

        if (messageType === 'session_welcome') {
          const sessionId = response.payload.session.id;
          updateConnectionStatus('connected', 'Conectado à Twitch');

          await subscribeToEvent(sessionId, 'channel.prediction.begin');
          await subscribeToEvent(sessionId, 'channel.prediction.progress');
          await subscribeToEvent(sessionId, 'channel.prediction.end');
        }

        if (messageType === 'notification') {
          const subscriptionType = response.metadata.subscription_type;
          const eventData = response.payload.event;
          handleTwitchPredictionNotification(subscriptionType, eventData);
        }
      };

      twitchSocket.onerror = (err) => {
        console.error('❌ Erro WebSocket:', err);
        updateConnectionStatus('error', 'Erro na Conexão');
      };

      twitchSocket.onclose = () => {
        updateConnectionStatus('connecting', 'Reconectando em 5s...');
        setTimeout(connectTwitchEventSub, 5000);
      };
    }

    async function subscribeToEvent(sessionId, eventType) {
      try {
        const res = await fetch(VERCEL_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, eventType })
        });
        const data = await res.json();
        if (res.ok) {
          console.log(`📡 Inscrito no evento: ${eventType}`);
        }
      } catch (error) {
        console.error('❌ Erro de conexão com Vercel:', error);
      }
    }

    function handleTwitchPredictionNotification(type, event) {
      if (type === 'channel.prediction.begin') {
        resetStateMachine('ACTIVE');

        const mappedOptions = event.outcomes.map((o, idx) => ({
          id: String(idx + 1),
          twitchId: o.id || '',
          title: o.title,
          votes: o.channel_points || 0,
          usersCount: o.users || 0,
          color: OPTION_COLORS[idx % OPTION_COLORS.length],
          topPredictors: []
        }));

        let remainingSecs = 120;
        if (event.locks_at) {
          const lockTime = new Date(event.locks_at).getTime();
          remainingSecs = Math.max(0, Math.floor((lockTime - Date.now()) / 1000));
        }

        updateState({
          title: event.title,
          status: 'ACTIVE',
          totalDuration: remainingSecs,
          remainingTime: remainingSecs,
          winningOptionId: null,
          isVisible: true,
          options: mappedOptions
        });

        startTimerIfNeeded();
        showToast(`Novo Palpite: "${event.title}"`);
      }

      if (type === 'channel.prediction.progress') {
        const mappedOptions = event.outcomes.map((o, idx) => ({
          id: String(idx + 1),
          twitchId: o.id || '',
          title: o.title,
          votes: o.channel_points || 0,
          usersCount: o.users || 0,
          color: OPTION_COLORS[idx % OPTION_COLORS.length],
          topPredictors: o.top_predictors ? o.top_predictors.map(p => ({
            name: p.user_name || p.user_login || 'Usuário',
            points: p.channel_points_used || 0,
            won: p.channel_points_won || 0
          })) : []
        }));

        let remainingSecs = predictionState.remainingTime;
        if (event.locks_at) {
          const lockTime = new Date(event.locks_at).getTime();
          remainingSecs = Math.max(0, Math.floor((lockTime - Date.now()) / 1000));
        }

        updateState({
          title: event.title,
          remainingTime: remainingSecs,
          isVisible: true,
          options: mappedOptions
        });
      }

      if (type === 'channel.prediction.end') {
        clearTimeout(autoHideTimeout);
        
        const winningId = event.winning_outcome_id;
        const rawStatus = String(event.status || '').toUpperCase();
        const isResolved = rawStatus === 'RESOLVED' || Boolean(winningId);
        const status = isResolved ? 'RESOLVED' : 'CANCELLED';

        const winnerOpt = predictionState.options.find(o => 
          (o.twitchId && o.twitchId === winningId) || o.id === String(winningId)
        );
        
        const resolvedWinnerId = winnerOpt ? winnerOpt.id : (winningId ? String(winningId) : null);

        const updatedOptions = predictionState.options.map((opt, idx) => {
          const twitchOutcome = event.outcomes 
            ? event.outcomes.find(o => o.id === opt.twitchId || String(idx + 1) === opt.id) 
            : null;
            
          const isWinnerOpt = opt.id === resolvedWinnerId || opt.twitchId === winningId;
          
          let predictors = [];
          if (twitchOutcome && twitchOutcome.top_predictors) {
            predictors = twitchOutcome.top_predictors.map(p => ({
              name: p.user_name || p.user_login || 'Usuário',
              points: p.channel_points_used || 0,
              won: p.channel_points_won || 0,
              lost: isWinnerOpt ? 0 : (p.channel_points_used || 0)
            }));
          }
          return { 
            ...opt, 
            usersCount: twitchOutcome ? (twitchOutcome.users || opt.usersCount) : opt.usersCount,
            topPredictors: predictors 
          };
        });

        updateState({
          status: status,
          winningOptionId: resolvedWinnerId,
          options: updatedOptions,
          isVisible: true
        });

        if (status === 'RESOLVED') {
          try { confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } }); } catch(e){}
          showToast("Palpite Encerrado!");
        }

        scheduleAutoHide(10000);
      }
    }

    function updateConnectionStatus(type, text) {
      const dot = document.getElementById('status-dot');
      const label = document.getElementById('status-text');
      if (!dot || !label) return;

      label.innerText = text;
      if (type === 'connected') {
        dot.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse';
      } else if (type === 'connecting') {
        dot.className = 'w-2 h-2 rounded-full bg-amber-500 animate-pulse';
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-red-500';
      }
    }

    function updateState(newState) {
      predictionState = { ...predictionState, ...newState };
      localStorage.setItem('twitch_prediction_data', JSON.stringify(predictionState));
      broadcastChannel.postMessage(predictionState);
      renderApp();
    }

    function startTimerIfNeeded() {
      clearInterval(timerInterval);
      if (predictionState.status === 'ACTIVE' && predictionState.remainingTime > 0) {
        timerInterval = setInterval(() => {
          if (predictionState.remainingTime > 1) {
            predictionState.remainingTime -= 1;
            localStorage.setItem('twitch_prediction_data', JSON.stringify(predictionState));
            broadcastChannel.postMessage(predictionState);
            renderOverlayWidget();
          } else {
            predictionState.remainingTime = 0;
            predictionState.status = 'LOCKED';
            clearInterval(timerInterval);
            showToast("Votações encerradas!");
            updateState(predictionState);
            scheduleAutoHide(10000);
          }
        }, 1000);
      }
    }

    function renderOptionInputs(initialValues = ['Sim', 'Não']) {
      const container = document.getElementById('options-input-container');
      container.innerHTML = '';
      
      initialValues.forEach((val, idx) => {
        const div = document.createElement('div');
        div.className = 'flex items-center gap-2';
        const color = OPTION_COLORS[idx % OPTION_COLORS.length];
        
        div.innerHTML = `
          <div class="w-3.5 h-3.5 rounded-full ${color.bg} shrink-0"></div>

    function presetOptions(count) {
      const presets = {
        2: ['Sim', 'Não'],
        4: ['Fácil (Vitória)', 'Médio (Suado)', 'Difícil (Overtime)', 'Derrota'],
        6: ['Opção A', 'Opção B', 'Opção C', 'Opção D', 'Opção E', 'Opção F'],
        10: ['Opção 1', 'Opção 2', 'Opção 3', 'Opção 4', 'Opção 5', 'Opção 6', 'Opção 7', 'Opção 8', 'Opção 9', 'Opção 10']
      };
      renderOptionInputs(presets[count] || presets[2]);
    }

    function addOptionInput() {
      const inputs = Array.from(document.querySelectorAll('.option-input')).map(i => i.value);
      if (inputs.length < 10) {
        inputs.push(`Opção ${inputs.length + 1}`);
        renderOptionInputs(inputs);
      } else {
        showToast("Limite de 10 opções!");
      }
    }

    function removeOptionInput(btn) {
      const inputs = Array.from(document.querySelectorAll('.option-input')).map(i => i.value);
      if (inputs.length > 2) {
        const index = Array.from(btn.parentNode.parentNode.children).indexOf(btn.parentNode);
        inputs.splice(index, 1);
        renderOptionInputs(inputs);
      }
    }

    function setTimerInput(seconds) {
      document.getElementById('input-timer').value = seconds;
    }

    function handleStartPrediction(e) {
      e.preventDefault();
      resetStateMachine('ACTIVE');

      const title = document.getElementById('input-title').value;
      const duration = parseInt(document.getElementById('input-timer').value, 10);
      const optionElements = document.querySelectorAll('.option-input');
      
      const options = Array.from(optionElements).map((input, idx) => ({
        id: String(idx + 1),
        twitchId: '',
        title: input.value || `Opção ${idx + 1}`,
        votes: 0,
        usersCount: 0,
        color: OPTION_COLORS[idx % OPTION_COLORS.length],
        topPredictors: []
      }));

      updateState({
        title: title,
        status: 'ACTIVE',
        totalDuration: duration,
        remainingTime: duration,
        winningOptionId: null,
        isVisible: true,
        options: options
      });

      startTimerIfNeeded();
      showToast("Palpite Criado!");
    }

    function lockPrediction() {
      if (predictionState.status === 'ACTIVE') {
        clearInterval(timerInterval);
        updateState({ status: 'LOCKED', remainingTime: 0, isVisible: true });
        showToast("Votações trancadas!");
        scheduleAutoHide(10000);
      }
    }

    function cancelPrediction() {
      resetStateMachine('CANCELLED');
      updateState({ status: 'CANCELLED', remainingTime: 0, winningOptionId: null, isVisible: true });
      showToast("Palpite cancelado!");
      scheduleAutoHide(3000);
    }

    function addVotes(optionId, amount) {
      if (predictionState.status !== 'ACTIVE') return;
      const updatedOptions = predictionState.options.map(opt => {
        if (opt.id === optionId) {
          return { 
            ...opt, 
            votes: opt.votes + amount,
            usersCount: (opt.usersCount || 0) + 1
          };
        }
        return opt;
      });
      updateState({ options: updatedOptions, isVisible: true });
    }

      resetStateMachine('ACTIVE');
      const optList = Array.from({ length: 10 }, (_, i) => ({
        id: String(i + 1),
        twitchId: '',
        title: `Opção ${i + 1}`,
        votes: Math.floor(Math.random() * 8000) + 1000,
        usersCount: Math.floor(Math.random() * 15) + 3,
        color: OPTION_COLORS[i % OPTION_COLORS.length],
        topPredictors: []
      }));

      updateState({
        title: "Vamos escapar?",
        status: 'ACTIVE',
        totalDuration: 120,
        remainingTime: 120,
        winningOptionId: null,
        isVisible: true,
        options: optList
      });

      startTimerIfNeeded();
      showToast("Cenário de 10 Opções Simulado!");
    }

        if (opt.id === winnerId) {
          return {
            ...opt,
            usersCount: opt.usersCount || 6,
            topPredictors: [
              { name: 'Gaules', points: 5000, won: 12500 },
              { name: 'Alanzoka', points: 3500, won: 8750 },
              { name: 'Guifs', points: 2000, won: 5000 }

          return {
            ...opt,

              { name: 'Casimiro', points: 4200, lost: 4200 },
              { name: 'Nobru', points: 3000, lost: 3000 }

          };

      updateState({ status: 'RESOLVED', winningOptionId: winnerId, options: updatedOptions, isVisible: true });
      try { confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } }); } catch(err){}
      showToast("Palpite Encerrado!");
      scheduleAutoHide(10000);
    }

      renderControls();

    // RENDERIZADOR DO OVERLAY COM ROLAGEM AUTOMÁTICA EM LOOP (JS MARQUEE)
    function renderOverlayWidget() {
      const containerDual = document.getElementById('overlay-widget-container');
      const containerStandalone = document.getElementById('overlay-standalone-container');

      const visibilityClass = (predictionState.isVisible && predictionState.status !== 'IDLE') 
        ? 'widget-visible' 
        : 'widget-hidden';

      if (containerDual) containerDual.className = `w-full overlay-box-fixed widget-animated ${visibilityClass}`;
      if (containerStandalone) containerStandalone.className = `w-full overlay-box-fixed widget-animated ${visibilityClass}`;

      if (!predictionState.options || predictionState.options.length === 0) {
        return;
      }

      const totalVotes = predictionState.options.reduce((acc, curr) => acc + curr.votes, 0);
      const totalParticipants = predictionState.options.reduce((acc, curr) => acc + (curr.usersCount || 0), 0);

      const mins = Math.floor(predictionState.remainingTime / 60);
      const secs = predictionState.remainingTime % 60;
      const formattedTime = `${mins}:${secs < 10 ? '0' : ''}${secs}`;

      const winnerOption = predictionState.options.find(o => o.id === predictionState.winningOptionId);
      const loserOptions = predictionState.options.filter(o => o.id !== predictionState.winningOptionId);
      
      const loserVotes = loserOptions.reduce((sum, o) => sum + o.votes, 0);
      const winnerVotes = winnerOption ? winnerOption.votes : 0;
      
      const returnRatio = (winnerVotes > 0) ? ((totalVotes / winnerVotes)).toFixed(2) : "1.00";
      const returnPer1k = Math.round(1000 * parseFloat(returnRatio));

      // BARRAS MULTISEGMENTADAS
      let progressBarSegments = '';

        const pct = totalVotes > 0 ? ((opt.votes / totalVotes) * 100).toFixed(1) : (100 / predictionState.options.length).toFixed(1);
        progressBarSegments += `
          <div style="width: ${pct}%" class="h-full ${opt.color.bg} transition-all duration-500 relative"></div>

        if (isResolved) {
          if (isWinner) {
            cardStyle = "bg-gradient-to-br from-emerald-950/90 via-emerald-900/50 to-emerald-950/80 border border-emerald-400 shadow-md scale-[1.01]";
            badgeResult = `
              <span class="bg-emerald-500 text-black font-black text-[7.5px] px-1 py-0.2 rounded tracking-wider uppercase flex items-center gap-0.5 shadow-md whitespace-nowrap">
                <i data-lucide="trophy" class="w-2 h-2"></i> Win
              </span>
            `;
          } else {
            cardStyle = "opacity-40 grayscale-[50%] glass-card border-red-500/30";
            badgeResult = `
              <span class="bg-red-500/20 text-red-400 border border-red-500/40 font-bold text-[7.5px] px-1 py-0.2 rounded tracking-wider uppercase whitespace-nowrap">
                Loss
              </span>
            `;
          }
        }

        optionsCardsHTML += `
          <div class="${isUltraCompact ? 'p-1.5' : isCompact ? 'p-2' : 'p-3'} rounded-xl transition-all duration-300 ${cardStyle} flex flex-col justify-between relative overflow-hidden">
            <div class="absolute left-0 top-0 bottom-0 w-1 ${opt.color.bg}"></div>

            <div class="flex items-start justify-between gap-1 mb-0.5 pl-1">
              <span class="font-display font-extrabold ${isUltraCompact ? 'text-[11px]' : isCompact ? 'text-xs' : 'text-sm'} text-white tracking-wide uppercase line-clamp-1">
                ${escapeHtml(opt.title)}
              </span>
              ${badgeResult}
            </div>

            <div class="flex items-end justify-between pl-1 mt-0.5">
              <div>
                <div class="${isUltraCompact ? 'text-base' : isCompact ? 'text-lg' : 'text-xl'} font-black text-white font-display tracking-tight flex items-baseline gap-0.5">
                  ${pct}<span class="text-[9px] font-bold text-gray-400">%</span>
                </div>
                <div class="text-[8.5px] text-gray-400 font-medium flex items-center gap-0.5 flex-wrap">
                  <span class="flex items-center gap-0.5 text-gray-300 font-semibold"><i data-lucide="users" class="w-2 h-2 text-twitch-purple"></i> ${participantsCount}</span>
                  <span class="text-gray-500">•</span>
                  <span>${formattedVotes}</span>
                </div>
              </div>

              <div class="${isUltraCompact ? 'w-4 h-4 text-[8px]' : isCompact ? 'w-5 h-5 text-[9px]' : 'w-6 h-6 text-xs'} shrink-0 rounded-full ${opt.color.bg}/20 border ${opt.color.border} flex items-center justify-center ${opt.color.text} font-bold overflow-hidden">
                ${displayIndex}
              </div>
            </div>
          </div>
        `;
      });

      const widgetHTML = `
        <div class="glass-panel p-3 md:p-3.5 rounded-2xl shadow-2xl border border-white/10 relative overflow-hidden">
          <div class="absolute -top-24 -right-24 w-48 h-48 bg-twitch-purple/20 rounded-full blur-3xl pointer-events-none"></div>

          <div class="flex items-center justify-between gap-2 mb-1.5 pb-1 border-b border-white/10">
            <div class="flex items-center gap-1.5 min-w-0">
              <div class="bg-twitch-purple p-1 rounded-lg text-white shadow-md shadow-twitch-purple/40 shrink-0">
                <i data-lucide="help-circle" class="w-3.5 h-3.5"></i>
              </div>
              <h3 class="font-display font-extrabold text-xs md:text-sm text-white tracking-wide uppercase truncate">
                ${escapeHtml(predictionState.title)}
              </h3>
            </div>
            ${statusBadge}
          </div>

          ${resultDetailsHTML}

          <div class="mb-2">
            <div class="h-2.5 w-full bg-black/60 rounded-full overflow-hidden p-0.5 border border-white/10 flex items-center gap-0.5 shadow-inner">
              ${progressBarSegments}
            </div>
            <div class="flex justify-between items-center mt-0.5 text-[8.5px] font-semibold text-gray-400 px-0.5 flex-wrap gap-1">
              <span>Total Apostado: <strong class="text-white">${totalVotes.toLocaleString('pt-BR')} pts</strong></span>
              <span class="flex items-center gap-1 text-twitch-accent font-bold">
                <i data-lucide="users" class="w-2.5 h-2.5"></i> ${totalParticipants} Participantes na Live
              </span>
            </div>
          </div>

          <div class="grid ${gridColumnsClass} gap-1">
            ${optionsCardsHTML}
          </div>

          <div class="mt-2 pt-1 flex items-center justify-between text-[7.5px] text-gray-500 font-medium border-t border-white/5">
            <span class="flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-twitch-purple"></span> Twitch Predictions Overlay
            </span>
            <span>boingy.co.uk inspired</span>
          </div>
        </div>
      `;

      if (containerDual) containerDual.innerHTML = widgetHTML;
      if (containerStandalone) containerStandalone.innerHTML = widgetHTML;

      lucide.createIcons();
    }

    // MOTOR DE ROLAGEM AUTOMÁTICA CONTÍNUA (JS LOOP)
    function initAutoScroll() {
      setTimeout(() => {
        const containers = document.querySelectorAll('[data-autoscroll]');
        containers.forEach(container => {
          const track = container.querySelector('.auto-scroll-track');
          if (!track) return;

          let scrollPos = 0;
          const speed = 0.5; // Velocidade do movimento horizontal
          let animationId = null;

          function step() {
            scrollPos += speed;
            // Quando atingir a metade exata (já que duplicamos os itens no HTML), reinicia sem salto visual
            if (scrollPos >= (track.scrollWidth / 2)) {
              scrollPos = 0;
            }
            track.style.transform = `translateX(-${scrollPos}px)`;
            animationId = requestAnimationFrame(step);
          }

          // Cancela animação anterior se houver
          if (container._animId) cancelAnimationFrame(container._animId);
          animationId = requestAnimationFrame(step);
          container._animId = animationId;

          container.onmouseenter = () => cancelAnimationFrame(animationId);
          container.onmouseleave = () => { animationId = requestAnimationFrame(step); };
        });
      }, 150);
    }

    function toggleViewMode() {
      const isOverlayOnly = document.body.classList.contains('overlay-only');
      if (isOverlayOnly) {
        disableOverlayOnlyMode();
      } else {
        enableOverlayOnlyMode();
      }
    }

    function enableOverlayOnlyMode() {
      document.body.classList.add('overlay-only');
      document.getElementById('app-header').classList.add('hidden');
      document.getElementById('dual-view').classList.add('hidden');
      document.getElementById('overlay-only-view').classList.remove('hidden');
      document.getElementById('view-mode-text').innerText = "Voltar ao Painel Admin";
    }

    function disableOverlayOnlyMode() {
      document.body.classList.remove('overlay-only');
      document.getElementById('app-header').classList.remove('hidden');
      document.getElementById('dual-view').classList.remove('hidden');
      document.getElementById('overlay-only-view').classList.add('hidden');
      document.getElementById('view-mode-text').innerText = "Apenas Overlay (OBS)";
    }

    function copyOverlayUrl() {
      const url = window.location.origin + window.location.pathname + '?overlay=true';
      const el = document.createElement('textarea');
      el.value = url;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      showToast("URL do OBS copiada!");
    }

    function showToast(message) {
      if (document.body.classList.contains('overlay-only')) return;

      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      toastMsg.innerText = message;
      
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>

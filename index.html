<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch Predictions Overlay</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Rajdhani -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Rajdhani', 'sans-serif'],
          },
          colors: {
            twitch: {
              purple: '#9146FF',
              darkPurple: '#5c16c5',
              dark: '#0e0e10',
              card: '#18181b',
              border: '#26262c',
              accent: '#00f5d4'
            }
          },
          animation: {
            'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'bounce-short': 'bounce 0.6s infinite alternate',
            'glow': 'glow 2s ease-in-out infinite alternate',
          },
          keyframes: {
            glow: {
              '0%': { boxShadow: '0 0 10px rgba(145, 70, 255, 0.4)' },
              '100%': { boxShadow: '0 0 25px rgba(145, 70, 255, 0.8), 0 0 10px rgba(0, 245, 212, 0.6)' }
            }
          }
        }
      }
    }
  </script>

  <style>
    body.overlay-only {
      background: transparent !important;
    }
    
    .glass-panel {
      background: rgba(18, 18, 23, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .glass-card {
      background: rgba(30, 30, 38, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0e0e10;
    }
    ::-webkit-scrollbar-thumb {
      background: #3a3a44;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #9146FF;
    }
  </style>
</head>
<body class="bg-[#09090b] text-gray-100 font-sans min-h-screen selection:bg-twitch-purple selection:text-white">

  <!-- BARRA DE NAVEGAÇÃO SUPERIOR -->
  <header id="app-header" class="bg-twitch-dark border-b border-twitch-border p-3 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="bg-twitch-purple p-2 rounded-xl text-white shadow-lg shadow-twitch-purple/30">
        <i data-lucide="help-circle" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="font-display text-xl font-extrabold tracking-wider text-white uppercase flex items-center gap-2">
          Overlay de Palpites <span class="bg-twitch-purple/20 text-twitch-purple text-xs px-2 py-0.5 rounded-full border border-twitch-purple/40 font-sans">Twitch EventSub Live</span>
        </h1>
        <p class="text-xs text-gray-400">Sincronização em tempo real com a Twitch e OBS Studio</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <!-- Status da Conexão WebSocket -->
      <div id="connection-status" class="flex items-center gap-1.5 bg-[#0e0e10] border border-twitch-border px-3 py-1.5 rounded-xl text-xs font-semibold text-gray-400">
        <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse" id="status-dot"></span>
        <span id="status-text">Conectando à Twitch...</span>
      </div>

      <button onclick="toggleViewMode()" id="view-mode-btn" class="flex items-center gap-2 bg-twitch-card hover:bg-gray-800 text-sm font-semibold py-2 px-4 rounded-xl border border-twitch-border transition-all">
        <i data-lucide="layout-dashboard" class="w-4 h-4 text-twitch-purple"></i>
        <span id="view-mode-text">Apenas Overlay (OBS)</span>
      </button>

      <button onclick="copyOverlayUrl()" class="flex items-center gap-2 bg-twitch-purple hover:bg-twitch-darkPurple text-white text-sm font-semibold py-2 px-4 rounded-xl transition-all shadow-md shadow-twitch-purple/20">
        <i data-lucide="copy" class="w-4 h-4"></i>
        <span>Copiar URL p/ OBS</span>
      </button>
    </div>
  </header>

  <!-- CONTAINER PRINCIPAL -->
  <main id="main-container" class="p-4 md:p-6 max-w-7xl mx-auto">
    
    <div id="dual-view" class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- PAINEL DE CONTROLE LOCAL / SIMULAÇÃO (5 cols) -->
      <section class="lg:col-span-5 space-y-6">
        
        <div class="bg-twitch-card rounded-2xl border border-twitch-border p-5 shadow-xl">
          <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
            <i data-lucide="settings" class="w-5 h-5 text-twitch-purple"></i>
            Configurar Palpite Manual
          </h2>

          <form id="prediction-form" onsubmit="handleStartPrediction(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Pergunta do Palpite</label>
              <input type="text" id="input-title" required placeholder="Ex: O streamer vai passar de fase?" class="w-full bg-[#0e0e10] border border-twitch-border focus:border-twitch-purple rounded-xl p-3 text-sm text-white focus:outline-none transition-all">
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Duração</label>
              <div class="grid grid-cols-3 gap-2">
                <button type="button" onclick="setTimerInput(60)" class="bg-[#0e0e10] hover:bg-twitch-purple/20 hover:border-twitch-purple border border-twitch-border text-xs py-2 rounded-lg font-semibold transition-all">1 Minuto</button>
                <button type="button" onclick="setTimerInput(120)" class="bg-[#0e0e10] hover:bg-twitch-purple/20 hover:border-twitch-purple border border-twitch-border text-xs py-2 rounded-lg font-semibold transition-all">2 Minutos</button>
                <button type="button" onclick="setTimerInput(300)" class="bg-[#0e0e10] hover:bg-twitch-purple/20 hover:border-twitch-purple border border-twitch-border text-xs py-2 rounded-lg font-semibold transition-all">5 Minutos</button>
              </div>
              <div class="mt-2 flex items-center gap-2">
                <input type="number" id="input-timer" min="10" max="3600" value="120" required class="w-full bg-[#0e0e10] border border-twitch-border focus:border-twitch-purple rounded-xl p-2.5 text-sm text-white focus:outline-none">
                <span class="text-xs text-gray-400 font-medium">segundos</span>
              </div>
            </div>

            <div>
              <div class="flex justify-between items-center mb-2">
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Opções (Mínimo 2)</label>
                <button type="button" onclick="addOptionInput()" class="text-xs text-twitch-purple hover:underline flex items-center gap-1 font-semibold">
                  <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> Adicionar Opção
                </button>
              </div>

              <div id="options-input-container" class="space-y-2">
                <!-- Opções inseridas via JS -->
              </div>
            </div>

            <button type="submit" id="btn-start" class="w-full bg-gradient-to-r from-twitch-purple to-purple-600 hover:from-purple-600 hover:to-twitch-darkPurple text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-twitch-purple/30 transition-all flex items-center justify-center gap-2">
              <i data-lucide="play" class="w-5 h-5 fill-current"></i>
              Iniciar Palpite Local
            </button>
          </form>
        </div>

        <div class="bg-twitch-card rounded-2xl border border-twitch-border p-5 shadow-xl space-y-4">
          <h2 class="text-lg font-bold text-white flex items-center gap-2">
            <i data-lucide="sliders" class="w-5 h-5 text-twitch-purple"></i>
            Controle de Simulação
          </h2>

          <div class="grid grid-cols-2 gap-2">
            <button onclick="lockPrediction()" id="btn-lock" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 py-2.5 px-3 rounded-xl font-semibold text-xs flex items-center justify-center gap-1.5 transition-all disabled:opacity-40">
              <i data-lucide="lock" class="w-4 h-4"></i> Trancar Votos
            </button>
            <button onclick="cancelPrediction()" id="btn-cancel" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 py-2.5 px-3 rounded-xl font-semibold text-xs flex items-center justify-center gap-1.5 transition-all disabled:opacity-40">
              <i data-lucide="x-circle" class="w-4 h-4"></i> Resetar / Cancelar
            </button>
          </div>

          <hr class="border-twitch-border my-2">

          <div>
            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Simular Votos Locais</label>
            <div id="vote-simulation-controls" class="space-y-2"></div>
          </div>

          <hr class="border-twitch-border my-2">

          <div>
            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Encerrar & Vencedor</label>
            <div id="resolve-controls" class="grid grid-cols-1 gap-2"></div>
          </div>
        </div>

      </section>

      <!-- VISUALIZAÇÃO PRÉVIA DO OVERLAY (7 cols) -->
      <section class="lg:col-span-7 flex flex-col">
        <div class="bg-twitch-card/60 rounded-2xl border border-twitch-border p-4 flex-1 flex flex-col">
          <div class="flex items-center justify-between mb-4">
            <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
              Visualização Prévia do Overlay (OBS)
            </span>
            <span class="text-xs text-gray-500">Fundo Transparente</span>
          </div>

          <div class="flex-1 min-h-[450px] bg-[#050508] border border-dashed border-twitch-border rounded-xl p-4 md:p-8 flex items-center justify-center relative overflow-hidden bg-[radial-gradient(#1e1e24_1px,transparent_1px)] [background-size:16px_16px]">
            <div id="overlay-widget-container" class="w-full max-w-2xl"></div>
          </div>
        </div>
      </section>

    </div>

    <!-- MODO APENAS OVERLAY (OBS BROWSER SOURCE) -->
    <div id="overlay-only-view" class="hidden min-h-screen flex items-center justify-center p-4">
      <div id="overlay-standalone-container" class="w-full max-w-3xl"></div>
    </div>

  </main>

  <!-- NOTIFICAÇÃO TOAST -->
  <div id="toast" class="fixed bottom-5 right-5 bg-twitch-purple text-white px-4 py-3 rounded-xl shadow-2xl transition-all transform translate-y-20 opacity-0 flex items-center gap-2 text-sm font-semibold z-50">
    <i data-lucide="check-circle" class="w-5 h-5"></i>
    <span id="toast-message">Mensagem</span>
  </div>

  <script>
    // --- CONFIGURAÇÃO DA VERCEL API ---
    const VERCEL_API_URL = window.location.origin.includes('localhost') 
      ? '/api/subscribe' 
      : 'https://twitch-prediction-overlay-steel.vercel.app/api/subscribe';

    // --- CORES DA TWITCH ---
    const OPTION_COLORS = [
      { name: 'Azul Twitch', hex: '#3894FE', bg: 'bg-[#3894FE]', text: 'text-[#3894FE]', border: 'border-[#3894FE]' },
      { name: 'Rosa/Magenta', hex: '#F14A97', bg: 'bg-[#F14A97]', text: 'text-[#F14A97]', border: 'border-[#F14A97]' },
      { name: 'Ciano', hex: '#00F5D4', bg: 'bg-[#00F5D4]', text: 'text-[#00F5D4]', border: 'border-[#00F5D4]' },
      { name: 'Amarelo', hex: '#FEE440', bg: 'bg-[#FEE440]', text: 'text-[#FEE440]', border: 'border-[#FEE440]' },
      { name: 'Roxo', hex: '#9146FF', bg: 'bg-[#9146FF]', text: 'text-[#9146FF]', border: 'border-[#9146FF]' },
      { name: 'Laranja', hex: '#FF9F1C', bg: 'bg-[#FF9F1C]', text: 'text-[#FF9F1C]', border: 'border-[#FF9F1C]' }
    ];

    // --- ESTADO INICIAL ---
    let predictionState = {
      title: "Aguardando palpite na Twitch...",
      status: "ACTIVE", 
      totalDuration: 120,
      remainingTime: 120,
      winningOptionId: null,
      options: [
        { id: '1', twitchId: '', title: 'Sim', votes: 0, color: OPTION_COLORS[0] },
        { id: '2', twitchId: '', title: 'Não', votes: 0, color: OPTION_COLORS[1] }
      ]
    };

    let timerInterval = null;
    let twitchSocket = null;
    const broadcastChannel = new BroadcastChannel('twitch_prediction_channel');

    // --- INICIALIZAÇÃO ---
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('overlay') === 'true') {
        enableOverlayOnlyMode();
      }

      const savedState = localStorage.getItem('twitch_prediction_data');
      if (savedState) {
        try { predictionState = JSON.parse(savedState); } catch(e){}
      }

      renderOptionInputs([predictionState.options[0]?.title || 'Sim', predictionState.options[1]?.title || 'Não']);
      renderApp();
      startTimerIfNeeded();

      broadcastChannel.onmessage = (event) => {
        if (event.data) {
          predictionState = event.data;
          renderApp();
        }
      };

      // Iniciar Conexão EventSub via WebSocket
      connectTwitchEventSub();
      lucide.createIcons();
    };

    // --- CONEXÃO WEBSOCKET TWITCH EVENTSUB ---
    function connectTwitchEventSub() {
      updateConnectionStatus('connecting', 'Conectando à Twitch...');
      twitchSocket = new WebSocket('wss://eventsub.wss.twitch.tv/ws');

      twitchSocket.onopen = () => {
        console.log('✅ Conectado ao WebSocket do EventSub da Twitch!');
      };

      twitchSocket.onmessage = async (event) => {
        const response = JSON.parse(event.data);
        const messageType = response.metadata.message_type;

        if (messageType === 'session_welcome') {
          const sessionId = response.payload.session.id;
          console.log('🔑 Session ID obtido:', sessionId);
          updateConnectionStatus('connected', 'Conectado à Twitch');

          // Inscrever nos eventos de palpite
          await subscribeToEvent(sessionId, 'channel.prediction.begin');
          await subscribeToEvent(sessionId, 'channel.prediction.progress');
          await subscribeToEvent(sessionId, 'channel.prediction.end');
        }

        if (messageType === 'session_keepalive') {
          return;
        }

        if (messageType === 'notification') {
          const subscriptionType = response.metadata.subscription_type;
          const eventData = response.payload.event;
          handleTwitchPredictionNotification(subscriptionType, eventData);
        }
      };

      twitchSocket.onerror = (err) => {
        console.error('❌ Erro WebSocket:', err);
        updateConnectionStatus('error', 'Erro na Conexão');
      };

      twitchSocket.onclose = () => {
        console.warn('⚠️ Conexão perdida. Reconectando em 5 segundos...');
        updateConnectionStatus('connecting', 'Reconectando...');
        setTimeout(connectTwitchEventSub, 5000);
      };
    }

    async function subscribeToEvent(sessionId, eventType) {
      try {
        const res = await fetch(VERCEL_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, eventType })
        });

        const data = await res.json();
        if (res.ok) {
          console.log(`📡 Evento ${eventType} inscrito com sucesso!`);
        } else {
          console.error(`❌ Erro ao inscrever ${eventType}:`, data);
        }
      } catch (error) {
        console.error('❌ Erro de rede ao conectar à Vercel:', error);
      }
    }

    // --- PROCESSAR EVENTOS VINDOS DA TWITCH ---
    function handleTwitchPredictionNotification(type, event) {
      const totalPoints = event.outcomes ? event.outcomes.reduce((acc, o) => acc + (o.channel_points || 0), 0) : 0;

      if (type === 'channel.prediction.begin' || type === 'channel.prediction.progress') {
        // Garantimos id numérico (1, 2...) para UI e preservamos o UUID da Twitch em twitchId
        const mappedOptions = event.outcomes.map((o, idx) => ({
          id: String(idx + 1),
          twitchId: o.id || '',
          title: o.title,
          votes: o.channel_points || 0,
          color: OPTION_COLORS[idx % OPTION_COLORS.length]
        }));

        let remainingSecs = 120;
        if (event.locks_at) {
          const lockTime = new Date(event.locks_at).getTime();
          remainingSecs = Math.max(0, Math.floor((lockTime - Date.now()) / 1000));
        }

        updateState({
          title: event.title,
          status: type === 'channel.prediction.begin' ? 'ACTIVE' : (predictionState.status || 'ACTIVE'),
          totalDuration: remainingSecs > 0 ? remainingSecs : predictionState.totalDuration,
          remainingTime: remainingSecs,
          winningOptionId: null,
          options: mappedOptions
        });

        if (type === 'channel.prediction.begin') {
          startTimerIfNeeded();
          showToast(`Palpite Iniciado na Twitch: "${event.title}"`);
        }
      }

      if (type === 'channel.prediction.end') {
        const winningId = event.winning_outcome_id;
        const status = event.status === 'RESOLVED' ? 'RESOLVED' : 'CANCELLED';

        // Encontra o id local (1, 2...) correspondente ao winning_outcome_id (UUID) da Twitch
        const winnerOpt = predictionState.options.find(o => o.twitchId === winningId || o.id === winningId);
        const resolvedWinnerId = winnerOpt ? winnerOpt.id : winningId;

        updateState({
          status: status,
          winningOptionId: resolvedWinnerId
        });

        if (status === 'RESOLVED') {
          try {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
          } catch(e){}
          showToast("Palpite Encerrado na Twitch!");
        }
      }
    }

    function updateConnectionStatus(type, text) {
      const dot = document.getElementById('status-dot');
      const label = document.getElementById('status-text');
      if (!dot || !label) return;

      label.innerText = text;
      if (type === 'connected') {
        dot.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse';
      } else if (type === 'connecting') {
        dot.className = 'w-2 h-2 rounded-full bg-amber-500 animate-pulse';
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-red-500';
      }
    }

    // --- ESTADO E TIMERS ---
    function updateState(newState) {
      predictionState = { ...predictionState, ...newState };
      localStorage.setItem('twitch_prediction_data', JSON.stringify(predictionState));
      broadcastChannel.postMessage(predictionState);
      renderApp();
    }

    function startTimerIfNeeded() {
      clearInterval(timerInterval);
      if (predictionState.status === 'ACTIVE' && predictionState.remainingTime > 0) {
        timerInterval = setInterval(() => {
          if (predictionState.remainingTime > 1) {
            predictionState.remainingTime -= 1;
            localStorage.setItem('twitch_prediction_data', JSON.stringify(predictionState));
            broadcastChannel.postMessage(predictionState);
            renderOverlayWidget();
          } else {
            predictionState.remainingTime = 0;
            predictionState.status = 'LOCKED';
            clearInterval(timerInterval);
            showToast("Votação encerrada!");
            updateState(predictionState);
          }
        }, 1000);
      }
    }

    // --- MANIPULAÇÃO DO FORMULÁRIO LOCAL ---
    function renderOptionInputs(initialValues = ['Sim', 'Não']) {
      const container = document.getElementById('options-input-container');
      container.innerHTML = '';
      
      initialValues.forEach((val, idx) => {
        const div = document.createElement('div');
        div.className = 'flex items-center gap-2';
        const color = OPTION_COLORS[idx % OPTION_COLORS.length];
        
        div.innerHTML = `
          <div class="w-3.5 h-3.5 rounded-full ${color.bg} shrink-0"></div>
          <input type="text" value="${escapeHtml(val)}" required placeholder="Opção ${idx + 1}" class="option-input flex-1 bg-[#0e0e10] border border-twitch-border focus:border-twitch-purple rounded-xl p-2.5 text-sm text-white focus:outline-none">
          ${initialValues.length > 2 ? `
            <button type="button" onclick="removeOptionInput(this)" class="p-2 text-gray-500 hover:text-red-400">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          ` : ''}
        `;
        container.appendChild(div);
      });
      lucide.createIcons();
    }

    function addOptionInput() {
      const inputs = Array.from(document.querySelectorAll('.option-input')).map(i => i.value);
      if (inputs.length < 6) {
        inputs.push(`Opção ${inputs.length + 1}`);
        renderOptionInputs(inputs);
      } else {
        showToast("Máximo de 6 opções!");
      }
    }

    function removeOptionInput(btn) {
      const inputs = Array.from(document.querySelectorAll('.option-input')).map(i => i.value);
      if (inputs.length > 2) {
        const index = Array.from(btn.parentNode.parentNode.children).indexOf(btn.parentNode);
        inputs.splice(index, 1);
        renderOptionInputs(inputs);
      }
    }

    function setTimerInput(seconds) {
      document.getElementById('input-timer').value = seconds;
    }

    function handleStartPrediction(e) {
      e.preventDefault();
      const title = document.getElementById('input-title').value;
      const duration = parseInt(document.getElementById('input-timer').value, 10);
      const optionElements = document.querySelectorAll('.option-input');
      
      const options = Array.from(optionElements).map((input, idx) => ({
        id: String(idx + 1),
        twitchId: '',
        title: input.value || `Opção ${idx + 1}`,
        votes: 0,
        color: OPTION_COLORS[idx % OPTION_COLORS.length]
      }));

      updateState({
        title: title,
        status: 'ACTIVE',
        totalDuration: duration,
        remainingTime: duration,
        winningOptionId: null,
        options: options
      });

      startTimerIfNeeded();
      showToast("Palpite Local Criado!");
    }

    function lockPrediction() {
      if (predictionState.status === 'ACTIVE') {
        clearInterval(timerInterval);
        updateState({ status: 'LOCKED', remainingTime: 0 });
        showToast("Votações trancadas!");
      }
    }

    function cancelPrediction() {
      clearInterval(timerInterval);
      updateState({ status: 'CANCELLED', remainingTime: 0, winningOptionId: null });
      showToast("Palpite cancelado/resetado!");
    }

    function addVotes(optionId, amount) {
      if (predictionState.status !== 'ACTIVE') {
        showToast("A votação precisa estar ATIVA para adicionar votos!");
        return;
      }
      const updatedOptions = predictionState.options.map(opt => {
        if (opt.id === optionId) {
          return { ...opt, votes: opt.votes + amount };
        }
        return opt;
      });
      updateState({ options: updatedOptions });
    }

    function resolvePrediction(winnerId) {
      updateState({ status: 'RESOLVED', winningOptionId: winnerId });
      try {
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      } catch(err){}
      showToast("Predição Encerrada!");
    }

    // --- RENDERIZAÇÃO DA INTERFACE ---
    function renderApp() {
      renderControls();
      renderOverlayWidget();
    }

    function renderControls() {
      const titleInput = document.getElementById('input-title');
      if (titleInput && !titleInput.value) {
        titleInput.value = predictionState.title;
      }

      const simContainer = document.getElementById('vote-simulation-controls');
      if (simContainer) {
        simContainer.innerHTML = '';
        predictionState.options.forEach(opt => {
          const div = document.createElement('div');
          div.className = 'flex items-center justify-between gap-2 bg-[#0e0e10] p-2 rounded-xl border border-twitch-border';
          div.innerHTML = `
            <span class="text-xs font-semibold flex items-center gap-1.5 truncate">
              <span class="w-2.5 h-2.5 rounded-full ${opt.color.bg}"></span>
              ${escapeHtml(opt.title)}
            </span>
            <div class="flex items-center gap-1">
              <button onclick="addVotes('${opt.id}', 100)" class="bg-twitch-card hover:bg-gray-800 text-[10px] font-bold py-1 px-2 rounded-lg border border-twitch-border text-gray-300 transition-all">+100</button>
              <button onclick="addVotes('${opt.id}', 1000)" class="bg-twitch-card hover:bg-gray-800 text-[10px] font-bold py-1 px-2 rounded-lg border border-twitch-border text-twitch-purple transition-all">+1k</button>
              <button onclick="addVotes('${opt.id}', 5000)" class="bg-twitch-card hover:bg-gray-800 text-[10px] font-bold py-1 px-2 rounded-lg border border-twitch-border text-emerald-400 transition-all">+5k</button>
            </div>
          `;
          simContainer.appendChild(div);
        });
      }

      const resolveContainer = document.getElementById('resolve-controls');
      if (resolveContainer) {
        resolveContainer.innerHTML = '';
        predictionState.options.forEach(opt => {
          const isWinner = predictionState.winningOptionId === opt.id;
          const btn = document.createElement('button');
          btn.onclick = () => resolvePrediction(opt.id);
          btn.className = `w-full text-xs font-bold py-2.5 px-3 rounded-xl border transition-all flex items-center justify-between ${
            isWinner 
              ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400' 
              : 'bg-[#0e0e10] hover:bg-twitch-purple/20 border-twitch-border text-gray-300'
          }`;
          btn.innerHTML = `
            <span class="flex items-center gap-2">
              <i data-lucide="trophy" class="w-4 h-4 ${isWinner ? 'text-emerald-400' : 'text-gray-500'}"></i>
              Vencedor: "${escapeHtml(opt.title)}"
            </span>
            ${isWinner ? '<span class="text-[10px] uppercase bg-emerald-500/30 px-2 py-0.5 rounded font-black">Ativo</span>' : ''}
          `;
          resolveContainer.appendChild(btn);
        });
        lucide.createIcons();
      }

      const btnLock = document.getElementById('btn-lock');
      if (btnLock) {
        btnLock.disabled = predictionState.status !== 'ACTIVE';
      }
    }

    // --- OVERLAY WIDGET PRINCIPAL ---
    function renderOverlayWidget() {
      const totalVotes = predictionState.options.reduce((acc, curr) => acc + curr.votes, 0);
      
      const mins = Math.floor(predictionState.remainingTime / 60);
      const secs = predictionState.remainingTime % 60;
      const formattedTime = `${mins}:${secs < 10 ? '0' : ''}${secs}`;

      let progressBarSegments = '';
      predictionState.options.forEach((opt) => {
        const pct = totalVotes > 0 ? ((opt.votes / totalVotes) * 100).toFixed(1) : (100 / predictionState.options.length).toFixed(1);
        progressBarSegments += `
          <div style="width: ${pct}%" class="h-full ${opt.color.bg} transition-all duration-500 relative group"></div>
        `;
      });

      let statusBadge = '';
      if (predictionState.status === 'ACTIVE') {
        statusBadge = `
          <div class="flex items-center gap-1.5 bg-purple-900/60 text-purple-200 border border-purple-500/40 px-3 py-1 rounded-full text-xs font-bold animate-pulse">
            <i data-lucide="clock" class="w-3.5 h-3.5 text-twitch-accent"></i>
            <span>${formattedTime}</span>
          </div>
        `;
      } else if (predictionState.status === 'LOCKED') {
        statusBadge = `
          <div class="flex items-center gap-1.5 bg-amber-900/60 text-amber-200 border border-amber-500/40 px-3 py-1 rounded-full text-xs font-bold">
            <i data-lucide="lock" class="w-3.5 h-3.5"></i>
            <span>VOTAÇÕES ENCERRADAS</span>
          </div>
        `;
      } else if (predictionState.status === 'RESOLVED') {
        statusBadge = `
          <div class="flex items-center gap-1.5 bg-emerald-900/60 text-emerald-200 border border-emerald-500/40 px-3 py-1 rounded-full text-xs font-bold">
            <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i>
            <span>RESULTADO FINAL</span>
          </div>
        `;
      } else {
        statusBadge = `
          <div class="flex items-center gap-1.5 bg-red-900/60 text-red-200 border border-red-500/40 px-3 py-1 rounded-full text-xs font-bold">
            <i data-lucide="x-circle" class="w-3.5 h-3.5"></i>
            <span>CANCELADO</span>
          </div>
        `;
      }

      let optionsCardsHTML = '';
      predictionState.options.forEach((opt) => {
        const pct = totalVotes > 0 ? ((opt.votes / totalVotes) * 100).toFixed(0) : 0;
        const formattedVotes = opt.votes.toLocaleString('pt-BR');
        const isWinner = predictionState.winningOptionId === opt.id;
        const isResolved = predictionState.status === 'RESOLVED';

        let cardStyle = "glass-card border-white/10";
        let badgeResult = "";

        if (isResolved) {
          if (isWinner) {
            cardStyle = "bg-gradient-to-br from-emerald-950/80 to-emerald-900/40 border-2 border-emerald-400 shadow-lg shadow-emerald-500/20 scale-[1.02]";
            badgeResult = `
              <span class="bg-emerald-500 text-black font-black text-[10px] px-2 py-0.5 rounded tracking-wider uppercase flex items-center gap-1 shadow-md">
                <i data-lucide="trophy" class="w-3 h-3"></i> Vencedor
              </span>
            `;
          } else {
            cardStyle = "opacity-40 grayscale-[40%] glass-card border-red-500/20";
            badgeResult = `
              <span class="bg-red-500/20 text-red-400 border border-red-500/30 font-bold text-[10px] px-2 py-0.5 rounded tracking-wider uppercase">
                Perdedor
              </span>
            `;
          }
        }

        optionsCardsHTML += `
          <div class="p-4 rounded-xl transition-all duration-300 ${cardStyle} flex flex-col justify-between relative overflow-hidden">
            <div class="absolute left-0 top-0 bottom-0 w-1.5 ${opt.color.bg}"></div>

            <div class="flex items-start justify-between gap-2 mb-2 pl-2">
              <span class="font-display font-extrabold text-lg md:text-xl text-white tracking-wide uppercase line-clamp-1">
                ${escapeHtml(opt.title)}
              </span>
              ${badgeResult}
            </div>

            <div class="flex items-end justify-between pl-2 mt-2">
              <div>
                <div class="text-2xl md:text-3xl font-black text-white font-display tracking-tight flex items-baseline gap-1">
                  ${pct}<span class="text-sm font-bold text-gray-400">%</span>
                </div>
                <div class="text-[11px] text-gray-400 font-medium flex items-center gap-1">
                  <i data-lucide="zap" class="w-3 h-3 ${opt.color.text}"></i>
                  ${formattedVotes} pontos
                </div>
              </div>

              <!-- Sempre exibe o número de ordem limpo: 1, 2, 3... -->
              <div class="w-8 h-8 shrink-0 rounded-full ${opt.color.bg}/20 border ${opt.color.border} flex items-center justify-center ${opt.color.text} font-bold text-xs overflow-hidden">
                ${opt.id}
              </div>
            </div>
          </div>
        `;
      });

      const widgetHTML = `
        <div class="glass-panel p-5 md:p-6 rounded-2xl shadow-2xl border border-white/10 relative overflow-hidden">
          <div class="absolute -top-24 -right-24 w-48 h-48 bg-twitch-purple/20 rounded-full blur-3xl pointer-events-none"></div>

          <div class="flex items-center justify-between gap-4 mb-4 pb-3 border-b border-white/10">
            <div class="flex items-center gap-2.5">
              <div class="bg-twitch-purple p-1.5 rounded-lg text-white shadow-md shadow-twitch-purple/40">
                <i data-lucide="help-circle" class="w-5 h-5"></i>
              </div>
              <h3 class="font-display font-extrabold text-lg md:text-xl text-white tracking-wide uppercase line-clamp-1">
                ${escapeHtml(predictionState.title)}
              </h3>
            </div>
            ${statusBadge}
          </div>

          <div class="mb-5">
            <div class="h-4 w-full bg-black/60 rounded-full overflow-hidden p-0.5 border border-white/10 flex items-center gap-0.5 shadow-inner">
              ${progressBarSegments}
            </div>
            <div class="flex justify-between items-center mt-1.5 text-[11px] font-semibold text-gray-400 px-1">
              <span>Total de Pontos: <strong class="text-white">${totalVotes.toLocaleString('pt-BR')}</strong></span>
              <span class="flex items-center gap-1"><i data-lucide="users" class="w-3 h-3"></i> Twitch Live</span>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-${Math.min(predictionState.options.length, 3)} gap-3">
            ${optionsCardsHTML}
          </div>

          <div class="mt-4 pt-2 flex items-center justify-between text-[10px] text-gray-500 font-medium">
            <span class="flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-twitch-purple"></span> Twitch Predictions Overlay
            </span>
            <span>boingy.co.uk inspired</span>
          </div>
        </div>
      `;

      const containerDual = document.getElementById('overlay-widget-container');
      const containerStandalone = document.getElementById('overlay-standalone-container');

      if (containerDual) containerDual.innerHTML = widgetHTML;
      if (containerStandalone) containerStandalone.innerHTML = widgetHTML;

      lucide.createIcons();
    }

    // --- MODO OVERLAY-ONLY (OBS STUDIO) ---
    function toggleViewMode() {
      const isOverlayOnly = document.body.classList.contains('overlay-only');
      if (isOverlayOnly) {
        disableOverlayOnlyMode();
      } else {
        enableOverlayOnlyMode();
      }
    }

    function enableOverlayOnlyMode() {
      document.body.classList.add('overlay-only');
      document.getElementById('app-header').classList.add('hidden');
      document.getElementById('dual-view').classList.add('hidden');
      document.getElementById('overlay-only-view').classList.remove('hidden');
      document.getElementById('view-mode-text').innerText = "Voltar ao Painel Admin";
    }

    function disableOverlayOnlyMode() {
      document.body.classList.remove('overlay-only');
      document.getElementById('app-header').classList.remove('hidden');
      document.getElementById('dual-view').classList.remove('hidden');
      document.getElementById('overlay-only-view').classList.add('hidden');
      document.getElementById('view-mode-text').innerText = "Apenas Overlay (OBS)";
    }

    // --- UTILITÁRIOS ---
    function copyOverlayUrl() {
      const url = window.location.origin + window.location.pathname + '?overlay=true';
      const el = document.createElement('textarea');
      el.value = url;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);

      showToast("URL do OBS copiada com sucesso!");
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      toastMsg.innerText = message;
      
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>

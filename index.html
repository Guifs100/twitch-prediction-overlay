<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch Predictions Overlay</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Rajdhani', 'sans-serif'],
          },
          colors: {
            twitch: {
              purple: '#9146FF',
              darkPurple: '#5c16c5',
              dark: '#0e0e10',
              card: '#18181b',
              border: '#26262c',
              accent: '#00f5d4'
            }
          },
          animation: {
            'glow-winner': 'glowWinner 1.5s ease-in-out infinite alternate',
          },
          keyframes: {
            glowWinner: {
              '0%': { boxShadow: '0 0 20px rgba(16, 185, 129, 0.4)' },
              '100%': { boxShadow: '0 0 45px rgba(16, 185, 129, 0.9), 0 0 20px rgba(0, 245, 212, 0.6)' }
            }
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-[#09090b] text-gray-100 font-sans min-h-screen selection:bg-twitch-purple selection:text-white">

  <!-- CABEÇALHO ADMIN -->
  <header id="app-header" class="bg-twitch-dark border-b border-twitch-border p-3 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="bg-twitch-purple p-2 rounded-xl text-white shadow-lg shadow-twitch-purple/30">
        <i data-lucide="help-circle" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="font-display text-xl font-extrabold tracking-wider text-white uppercase flex items-center gap-2">
          Overlay de Palpites <span class="bg-twitch-purple/20 text-twitch-purple text-xs px-2 py-0.5 rounded-full border border-twitch-purple/40 font-sans">v1.0 Modular</span>
        </h1>
        <p class="text-xs text-gray-400">Arquitetura modular, limpeza automática de sessões e tempo real</p>
      </div>
    </div>

    <div class="flex items-center gap-2 flex-wrap">
      <button id="btn-twitch-toggle" title="Clique para conectar ou desconectar a Twitch neste painel" class="flex items-center gap-2 bg-[#0e0e10] hover:bg-gray-900 border border-twitch-border px-3 py-1.5 rounded-xl text-xs font-semibold text-gray-300 transition-all">
        <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse" id="status-dot"></span>
        <span id="status-text">Conectando à Twitch...</span>
      </button>

      <button id="view-mode-btn" class="flex items-center gap-2 bg-twitch-card hover:bg-gray-800 text-sm font-semibold py-2 px-4 rounded-xl border border-twitch-border transition-all">
        <i data-lucide="layout-dashboard" class="w-4 h-4 text-twitch-purple"></i>
        <span id="view-mode-text">Apenas Overlay (OBS)</span>
      </button>

      <button id="btn-copy-url" class="flex items-center gap-2 bg-twitch-purple hover:bg-twitch-darkPurple text-white text-sm font-semibold py-2 px-4 rounded-xl transition-all shadow-md shadow-twitch-purple/20">
        <i data-lucide="copy" class="w-4 h-4"></i>
        <span>Copiar URL p/ OBS</span>
      </button>
    </div>
  </header>

  <!-- CONTAINER PRINCIPAL -->
  <main id="main-container" class="w-full">
    <div id="dual-view" class="p-4 md:p-6 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- CONTROLES LOCAIS -->
      <section class="lg:col-span-5 space-y-6">
        <div class="bg-twitch-card rounded-2xl border border-twitch-border p-5 shadow-xl">
          <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
            <i data-lucide="settings" class="w-5 h-5 text-twitch-purple"></i>
            Configurar Palpite Manual
          </h2>

          <form id="prediction-form" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Pergunta do Palpite</label>
              <input type="text" id="input-title" required placeholder="Ex: Vamos escapar?" class="w-full bg-[#0e0e10] border border-twitch-border focus:border-twitch-purple rounded-xl p-3 text-sm text-white focus:outline-none">
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Duração</label>
              <div class="grid grid-cols-3 gap-2">
                <button type="button" data-timer-preset="60" class="bg-[#0e0e10] hover:bg-twitch-purple/20 border border-twitch-border text-xs py-2 rounded-lg font-semibold">1 Minuto</button>
                <button type="button" data-timer-preset="120" class="bg-[#0e0e10] hover:bg-twitch-purple/20 border border-twitch-border text-xs py-2 rounded-lg font-semibold">2 Minutos</button>
                <button type="button" data-timer-preset="300" class="bg-[#0e0e10] hover:bg-twitch-purple/20 border border-twitch-border text-xs py-2 rounded-lg font-semibold">5 Minutos</button>
              </div>
              <div class="mt-2 flex items-center gap-2">
                <input type="number" id="input-timer" min="10" max="3600" value="120" required class="w-full bg-[#0e0e10] border border-twitch-border focus:border-twitch-purple rounded-xl p-2.5 text-sm text-white focus:outline-none">
                <span class="text-xs text-gray-400 font-medium">segundos</span>
              </div>
            </div>

            <div>
              <div class="flex justify-between items-center mb-2">
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Preset de Opções</label>
                <div class="flex gap-1">
                  <button type="button" data-option-preset="2" class="text-[10px] bg-[#0e0e10] border border-twitch-border px-2 py-0.5 rounded text-gray-300 hover:text-white">2 Opções</button>
                  <button type="button" data-option-preset="4" class="text-[10px] bg-[#0e0e10] border border-twitch-border px-2 py-0.5 rounded text-gray-300 hover:text-white">4 Opções</button>
                  <button type="button" data-option-preset="6" class="text-[10px] bg-[#0e0e10] border border-twitch-border px-2 py-0.5 rounded text-gray-300 hover:text-white">6 Opções</button>
                  <button type="button" data-option-preset="10" class="text-[10px] bg-[#0e0e10] border border-twitch-border px-2 py-0.5 rounded text-gray-300 hover:text-white">10 Opções</button>
                </div>
              </div>
              <div id="options-input-container" class="space-y-2"></div>
            </div>

            <button type="submit" id="btn-start" class="w-full bg-gradient-to-r from-twitch-purple to-purple-600 hover:from-purple-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
              <i data-lucide="play" class="w-5 h-5 fill-current"></i>
              Iniciar Palpite Local
            </button>
          </form>
        </div>

        <div class="bg-twitch-card rounded-2xl border border-twitch-border p-5 shadow-xl space-y-4">
          <h2 class="text-lg font-bold text-white flex items-center gap-2">
            <i data-lucide="sliders" class="w-5 h-5 text-twitch-purple"></i>
            Controle de Simulação (Cenários)
          </h2>

          <div class="grid grid-cols-2 gap-2">
            <button id="btn-lock" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 py-2.5 px-3 rounded-xl font-semibold text-xs flex items-center justify-center gap-1.5 transition-all">
              <i data-lucide="lock" class="w-4 h-4"></i> Trancar Votos
            </button>
            <button id="btn-cancel" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 py-2.5 px-3 rounded-xl font-semibold text-xs flex items-center justify-center gap-1.5 transition-all">
              <i data-lucide="x-circle" class="w-4 h-4"></i> Resetar / Cancelar
            </button>
          </div>

          <hr class="border-twitch-border my-2">
          <div>
            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Simular Votos Locais</label>
            <div id="vote-simulation-controls" class="space-y-2"></div>
          </div>

          <hr class="border-twitch-border my-2">
          <div class="space-y-2">
            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">Testes Rápidos de Cenários</label>
            <button id="btn-sim-10" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-2 px-3 rounded-xl flex items-center justify-center gap-1.5 transition-all">
              <i data-lucide="layers" class="w-4 h-4"></i> Testar 10 Opções Ativas
            </button>
            <button id="btn-sim-heavy" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 px-3 rounded-xl flex items-center justify-center gap-1.5 transition-all">
              <i data-lucide="sparkles" class="w-4 h-4"></i> Simular Resultado Completo (Top 10+)
            </button>
            <div id="resolve-controls" class="grid grid-cols-1 gap-2 pt-1"></div>
          </div>
        </div>
      </section>

      <!-- VISUALIZAÇÃO PREVIEW NO ADMIN -->
      <section class="lg:col-span-7 flex flex-col">
        <div class="bg-twitch-card/60 rounded-2xl border border-twitch-border p-4 flex-1 flex flex-col">
          <div class="flex items-center justify-between mb-4">
            <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
              Visualização Prévia do Overlay (OBS)
            </span>
            <span class="text-xs text-amber-400 font-semibold">Auto-Hide em 15s após zerar o tempo ou encerrar</span>
          </div>

          <div class="flex-1 min-h-[500px] bg-[#050508] border border-dashed border-twitch-border rounded-xl p-4 md:p-8 flex items-center justify-center relative overflow-hidden">
            <div id="overlay-widget-container" class="w-full overlay-box-fixed widget-animated widget-hidden"></div>
          </div>
        </div>
      </section>

    </div>

    <!-- MODO OVERLAY EXCLUSIVO OBS (STANDALONE) -->
    <div id="overlay-only-view" class="hidden w-screen h-screen flex items-center justify-center p-6 box-border">
      <div id="overlay-standalone-container" class="w-full overlay-box-fixed widget-animated widget-hidden"></div>
    </div>
  </main>

  <div id="toast" class="fixed bottom-5 right-5 bg-twitch-purple text-white px-4 py-3 rounded-xl shadow-2xl transition-all transform translate-y-20 opacity-0 flex items-center gap-2 text-sm font-semibold z-50">
    <i data-lucide="check-circle" class="w-5 h-5"></i>
    <span id="toast-message">Mensagem</span>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
